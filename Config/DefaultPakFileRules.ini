[ExcludeUncookedCursorTextureSource]
; Slate hardware cursors use the raw PNG. Do not stage its unused editor Texture2D
; source package as raw Slate data; it has no cooked package manifest entry.
; A cooked copy remains eligible if this texture gains an asset reference later.
bExcludeFromPaks=true
bOverrideChunkManifest=false
+Files=".../Content/Slate/Cursors/CSDefaltCursor.uasset"
+Files="-.../Saved/Cooked/.../Content/Slate/Cursors/CSDefaltCursor.uasset"
